:root{

    --text:#222;
    --radius:16px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:tahoma,sans-serif;
    background:#f4f6f8;
    color:var(--text);
}

.main-content{

    margin-right:260px;
    padding:30px;

}

.page-header{

    background:#fff;
    border-radius:var(--radius);
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.05);

}

.page-header h1{

    font-size:28px;

}

.page-header p{

    color:#666;

}

.file-code{

    margin-top:20px;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
    padding:18px;
    border-radius:14px;
    font-size:15px;

}

.file-code strong{

    color:var(--gold);
    font-size:18px;

}

.form-section{

    background:#fff;
    border-radius:var(--radius);
    padding:25px;
    margin-bottom:22px;
    box-shadow:0 8px 20px rgba(0,0,0,.05);

}

.section-title{

    font-size:20px;
    font-weight:bold;
    margin-bottom:25px;
    padding-bottom:12px;
    border-bottom:2px solid #eee;

}

.form-grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:18px;

}

.form-group{

    display:flex;
    flex-direction:column;

}

.form-group label{

    margin-bottom:8px;
    font-weight:bold;

}

.form-group input,
.form-group select,
.form-group textarea{

    padding:12px;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    transition:.3s;

}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{

    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(200,164,77,.15);

}

.full{

    grid-column:1/-1;

}

.hidden{

    display:none;

}

.required{

    color:red;

}

.features-grid{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:12px;

}

.feature{

    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    cursor:pointer;
    transition:.3s;

}

.feature:hover{

}

.preview{

    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:15px;
    margin-top:15px;

}

.preview img{

}

.save-btn{

    border-radius:12px;

.save-btn:hover{

.cancel-btn{

    border-radius:12px;

@media(max-width:900px){

margin-right:0;

    <script>
    
    "use strict";
    
    let selectedImages=[];
    
    let editingProperty=null;
    
    
    
    /*=============================
        تولید کد فایل
    =============================*/
    
    function createCode(){
    
    return "KS-"+Date.now();
    
    }
    
    
    
    /*=============================
        دریافت مقدار
    =============================*/
    
    function val(id){
    
    const e=document.getElementById(id);
    
    return e?e.value.trim():"";
    
    }
    
    
    
    /*=============================
        نمایش عرصه و اعیان
    =============================*/
    
    function updatePropertyFields(){
    
    const type=val("propertyType");
    
    const land=document.getElementById("landAreaGroup");
    
    const building=document.getElementById("buildingAreaGroup");
    
    if(type==="حیاط مسکونی"){
    
    land.classList.remove("hidden");
    
    building.classList.remove("hidden");
    
    }else{
    
    land.classList.add("hidden");
    
    building.classList.add("hidden");
    
    document.getElementById("landArea").value="";
    
    document.getElementById("buildingArea").value="";
    
    }
    
    }
    
    
    
    /*=============================
        بارگذاری اولیه
    =============================*/
    
    document.addEventListener("DOMContentLoaded",()=>{
    
    document.getElementById("fileCode").textContent=createCode();
    
    document.getElementById("propertyType").addEventListener(
    
    "change",
    
    updatePropertyFields
    
    );
    
    updatePropertyFields();
    
    setupImages();
    
    loadEditingProperty();
    
    });
    
    
    
    /*=============================
          تصاویر
    =============================*/
    
    function setupImages(){
    
    const input=document.getElementById("propertyImages");
    
    input.addEventListener("change",(e)=>{
    
    Array.from(e.target.files).forEach(file=>{
    
    const reader=new FileReader();
    
    reader.onload=function(ev){
    
    selectedImages.push(ev.target.result);
    
    renderImages();
    
    };
    
    reader.readAsDataURL(file);
    
    });
    
    });
    
    }
    
    
    
    function renderImages(){
    
    const box=document.getElementById("imagePreview");
    
    box.innerHTML="";
    
    selectedImages.forEach((img,index)=>{
    
    box.innerHTML+=`
    
    <div class="preview-item">
    
    <img src="${img}">
    
    <button
    
    type="button"
    
    class="remove-image"
    
    onclick="removeImage(${index})">
    
    ×
    
    </button>
    
    </div>
    
    `;
    
    });
    
    }
    
    
    
    function removeImage(index){
    
    selectedImages.splice(index,1);
    
    renderImages();
    
    }
    /*==================================
      بارگذاری اطلاعات ویرایش
==================================*/

function loadEditingProperty(){

try{

editingProperty=JSON.parse(

localStorage.getItem("editProperty")

);

}catch{

editingProperty=null;

}

if(!editingProperty){

return;

}

document.getElementById("pageTitle").textContent="ویرایش ملک";

document.getElementById("saveBtn").innerHTML="💾 ذخیره تغییرات";

document.getElementById("fileCode").textContent=

editingProperty.code;

const ids=[

"transactionType",
"propertyType",
"region",
"area",
"rooms",
"floor",
"direction",
"buildingStatus",
"documentType",
"buildYear",
"unitsPerFloor",
"landArea",
"buildingArea",
"price",
"deposit",
"rent",
"floorMaterial",
"heatingType",
"coolingType",
"propertyAddress",
"description"

];

ids.forEach(id=>{

if(document.getElementById(id))

document.getElementById(id).value=

editingProperty[id]||"";

});

document.getElementById("ownerName").value=

editingProperty.owner?.name||"";

document.getElementById("ownerPhone").value=

editingProperty.owner?.phone||"";

selectedImages=

editingProperty.images||[];

renderImages();

updatePropertyFields();

if(editingProperty.features){

document

.querySelectorAll(".feature-item")

.forEach(item=>{

item.checked=

editingProperty.features.includes(

item.value

);

});

}

}



/*==================================
      اعتبارسنجی
==================================*/

function validateForm(){

if(!val("transactionType")){

alert("نوع معامله را انتخاب کنید.");

return false;

}

if(!val("propertyType")){

alert("نوع ملک را انتخاب کنید.");

return false;

}

if(!val("region")){

alert("نام منطقه را وارد کنید.");

return false;

}

if(!val("area")){

alert("متراژ را وارد کنید.");

return false;

}

return true;

}



/*==================================
      دریافت امکانات
==================================*/

function getFeatures(){

let features=[];

document

.querySelectorAll(".feature-item:checked")

.forEach(item=>{

features.push(item.value);

});

return features;

}



/*==================================
      ساخت شیء ملک
==================================*/

function buildPropertyObject(){

return{

id:

editingProperty?

editingProperty.id:

"property-"+Date.now(),

code:

editingProperty?

editingProperty.code:

createCode(),

transactionType:val("transactionType"),

propertyType:val("propertyType"),

region:val("region"),

area:val("area"),

rooms:val("rooms"),

floor:val("floor"),

direction:val("direction"),

buildingStatus:val("buildingStatus"),

documentType:val("documentType"),

buildYear:val("buildYear"),

unitsPerFloor:val("unitsPerFloor"),

landArea:

val("propertyType")==="حیاط مسکونی"

?val("landArea")

:"",

buildingArea:

val("propertyType")==="حیاط مسکونی"

?val("buildingArea")

:"",

price:val("price"),

deposit:val("deposit"),

rent:val("rent"),

floorMaterial:val("floorMaterial"),

heatingType:val("heatingType"),

coolingType:val("coolingType"),

features:getFeatures(),

owner:{

name:val("ownerName"),

phone:val("ownerPhone")

},

images:selectedImages,

propertyAddress:

val("propertyAddress"),

description:

val("description"),

createdBy:

editingProperty?

editingProperty.createdBy:

getCurrentUserName(),

createdAt:

editingProperty?

editingProperty.createdAt:

new Date()

.toLocaleDateString("fa-IR")

};

}
/*==================================
        ثبت نهایی
==================================*/

document
.getElementById("propertyForm")
.addEventListener(

"submit",

async function(e){

e.preventDefault();

if(!validateForm()){

return;

}

const property=

buildPropertyObject();

try{

const response=

await fetch(

"/api/properties",

{

method:"POST",

headers:{

"Content-Type":

"application/json"

},

body:JSON.stringify(property)

}

);

const result=

await response.json();

if(!response.ok){

throw new Error(

result.message||

"خطا در ثبت اطلاعات"

);

}

localStorage.removeItem(

"editProperty"

);

localStorage.removeItem(

"editingProperty"

);

alert(

editingProperty

?

"اطلاعات ملک با موفقیت ویرایش شد."

:

"ملک با موفقیت ثبت شد."

);

window.location.href=

"properties.html";

}catch(error){

console.error(error);

alert(

"خطا در ارتباط با سرور\n\n"

+

error.message

);

}

}

);



/*==================================
      خروج از سامانه
==================================*/

function logout(){

localStorage.removeItem(

"currentUser"

);

window.location.href=

"index.html";

}

</script>
