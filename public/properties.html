<!DOCTYPE html><html lang="fa" dir="rtl"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فایل‌های ملکی | سامانه تخصصی املاک کلبه سبز</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
    
    :root{
        --green:#17231c;
        --green2:#e9c600;
        --gold:#c7a54d;
        --gold2:#a88734;
        --light-gold:#faf5e7;
        --border:#e5e5e5;
        --text:#263129;
        --muted:#777;
        --danger:#9b3434;
    }
    
    *{
        box-sizing:border-box;
    }
    
    body{
        background:url("IMG_20260809_135729.png")
        center center / cover fixed no-repeat !important;
    
        position:relative;
    }
    
    body::before{
        content:"";
        position:fixed;
        inset:0;
    
        background:
        linear-gradient(
            135deg,
            rgba(8,24,18,.56),
            rgba(10,30,22,.18) 20%,
            rgba(8,20,15,.42)
        );
    
        z-index:-1;
        pointer-events:none;
    }
    
    .main-content{
        padding:25px;
        min-width:0;
    }
    
    
    /* =====================================================
       HEADER
    ===================================================== */
    
    .header{
        background:rgba(255,255,255,.97);
    
        padding:20px;
    
        border-radius:18px;
    
        margin-bottom:18px;
    
        display:flex;
    
        justify-content:space-between;
    
        align-items:center;
    
        gap:15px;
    
        box-shadow:
        0 6px 25px rgba(0,0,0,.08);
    }
    
    .header h1{
        margin:0 0 7px;
    
        font-size:25px;
    }
    
    .header p{
        color:var(--muted);
    
        margin:0;
    
        font-size:13px;
    }
    
    .add-btn{
        background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold2)
        );
    
        color:white;
    
        padding:12px 18px;
    
        border-radius:11px;
    
        text-decoration:none;
    
        font-weight:bold;
    
        white-space:nowrap;
    
        box-shadow:
        0 5px 15px rgba(199,165,77,.25);
    }
    
    
    /* =====================================================
       ADVANCED SEARCH
    ===================================================== */
    
    .advanced-search{
    
        background:rgba(255,255,255,.98);
    
        border-radius:18px;
    
        padding:18px;
    
        margin-bottom:18px;
    
        box-shadow:
        0 6px 25px rgba(0,0,0,.07);
    }
    
    
    .search-header{
    
        display:flex;
    
        justify-content:space-between;
    
        align-items:center;
    
        gap:15px;
    
        margin-bottom:16px;
    }
    
    
    .search-title{
    
        display:flex;
    
        align-items:center;
    
        gap:10px;
    
        font-size:17px;
    
        font-weight:bold;
    }
    
    
    .search-icon{
    
        width:38px;
    
        height:38px;
    
        display:flex;
    
        align-items:center;
    
        justify-content:center;
    
        background:var(--light-gold);
    
        border-radius:10px;
    
        font-size:19px;
    }
    
    
    .search-actions{
    
        display:flex;
    
        gap:8px;
    
        flex-wrap:wrap;
    }
    
    
    .search-btn{
    
        border:none;
    
        padding:10px 14px;
    
        border-radius:9px;
    
        cursor:pointer;
    
        font-family:inherit;
    
        font-weight:bold;
    }
    
    
    .more-btn{
    
        background:#edf2ee;
    
        color:var(--green2);
    }
    
    
    .reset-btn{
    
        background:#f8e7e7;
    
        color:var(--danger);
    }
    
    
    .search-grid{
    
        display:grid;
    
        grid-template-columns:
        2fr
        1fr
        1fr
        1fr
        1fr;
    
        gap:10px;
    }
    
    
    .field{
    
        display:flex;
    
        flex-direction:column;
    
        gap:6px;
    }
    
    
    .field label{
    
        font-size:11px;
    
        color:#777;
    
        font-weight:bold;
    }
    
    
    .field input,
    .field select{
    
        width:100%;
    
        min-height:43px;
    
        padding:10px;
    
        border:
        1px solid #ddd;
    
        border-radius:10px;
    
        outline:none;
    
        background:white;
    
        font-family:inherit;
    
        color:#333;
    
        transition:.2s;
    }
    
    
    .field input:focus,
    .field select:focus{
    
        border-color:var(--gold);
    
        box-shadow:
        0 0 0 3px
        rgba(199,165,77,.12);
    }
    
    
    /* =====================================================
       MORE FILTERS
    ===================================================== */
    
    .more-filters{
    
        display:none;
    
        margin-top:15px;
    
        padding-top:15px;
    
        border-top:
        1px dashed #ddd;
    }
    
    
    .more-filters.open{
    
        display:block;
    }
    
    
    .more-grid{
    
        display:grid;
    
        grid-template-columns:
        repeat(5,1fr);
    
        gap:10px;
    }
    
    
    /* =====================================================
       FEATURES FILTER
    ===================================================== */
    
    .features-title{
    
        font-size:12px;
    
        font-weight:bold;
    
        margin:
        16px 0 9px;
    }
    
    
    .features-filter{
    
        display:flex;
    
        flex-wrap:wrap;
    
        gap:7px;
    }
    
    
    .feature-check{
    
        position:relative;
    }
    
    
    .feature-check input{
    
        position:absolute;
    
        opacity:0;
    
        pointer-events:none;
    }
    
    
    .feature-check label{
    
        display:block;
    
        padding:8px 11px;
    
        background:#f4f6f4;
    
        border:
        1px solid #e0e4e0;
    
        border-radius:9px;
    
        font-size:11px;
    
        cursor:pointer;
    
        transition:.2s;
    }
    
    
    .feature-check input:checked + label{
    
        background:var(--green);
    
        border-color:var(--green);
    
        color:white;
    }
    
    
    /* =====================================================
       RESULT BAR
    ===================================================== */
    
    .result-bar{
    
        background:rgba(255,255,255,.97);
    
        border-radius:14px;
    
        padding:12px 15px;
    
        margin-bottom:15px;
    
        display:flex;
    
        justify-content:space-between;
    
        align-items:center;
    
        gap:10px;
    
        box-shadow:
        0 4px 15px rgba(0,0,0,.05);
    }
    
    
    .result-count{
    
        font-size:13px;
    
        font-weight:bold;
    }
    
    
    .result-count strong{
    
        color:#9a781d;
    
        font-size:15px;
    }
    
    
    .result-info{
    
        font-size:11px;
    
        color:#888;
    }
    
    
    /* =====================================================
       PROPERTIES
    ===================================================== */
    
    #propertiesContainer{
    
        display:grid;
    
        grid-template-columns:
        repeat(3,minmax(0,1fr));
    
        gap:16px;
    
        align-items:start;
    }
    
    
    .property-card{
    
        background:white;
    
        border-radius:18px;
    
        overflow:hidden;
    
        box-shadow:
        0 5px 20px rgba(0,0,0,.08);
    }
    
    
    .property-image{
    
        height:200px;
    
        background:#eee;
    
        position:relative;
    }
    
    
    .property-image img{
    
        width:100%;
    
        height:100%;
    
        object-fit:cover;
    
        display:block;
    }
    
    
    .no-image{
    
        height:100%;
    
        display:flex;
    
        align-items:center;
    
        justify-content:center;
    
        color:#999;
    
        font-size:13px;
    }
    
    
    .transaction-badge{
    
        position:absolute;
    
        top:12px;
    
        right:12px;
    
        background:var(--green);
    
        color:#d6b35a;
    
        padding:7px 13px;
    
        border-radius:20px;
    
        font-size:11px;
    
        font-weight:bold;
    }
    
    
    .property-type-badge{
    
        position:absolute;
    
        top:12px;
    
        left:12px;
    
        background:white;
    
        color:#333;
    
        padding:7px 12px;
    
        border-radius:20px;
    
        font-size:11px;
    
        box-shadow:
        0 2px 8px rgba(0,0,0,.15);
    }
    
    
    .image-count{
    
        position:absolute;
    
        bottom:10px;
    
        left:10px;
    
        background:rgba(0,0,0,.65);
    
        color:white;
    
        padding:5px 9px;
    
        border-radius:8px;
    
        font-size:10px;
    }
    
    
    .property-body{
    
        padding:18px;
    }
    
    
    .property-title{
    
        font-size:18px;
    
        font-weight:bold;
    
        margin-bottom:8px;
    }
    
    
    .location{
    
        color:#777;
    
        font-size:13px;
    
        margin-bottom:14px;
    }
    
    
    .transaction-box{
    
        background:var(--light-gold);
    
        border:
        1px solid #e3d19a;
    
        padding:11px;
    
        border-radius:11px;
    
        margin-bottom:14px;
    }
    
    
    .transaction-label{
    
        font-size:10px;
    
        color:#8a6b18;
    }
    
    
    .transaction-value{
    
        margin-top:4px;
    
        font-weight:bold;
    
        color:#6f5515;
    }
    
    
    .info-table{
    
        width:100%;
    
        border-collapse:collapse;
    
        margin-bottom:14px;
    }
    
    
    .info-table tr{
    
        border-bottom:
        1px solid #eee;
    }
    
    
    .info-table tr:last-child{
    
        border-bottom:none;
    }
    
    
    .info-table td{
    
        padding:8px 4px;
    
        font-size:11px;
    
        vertical-align:top;
    }
    
    
    .info-table td:first-child{
    
        color:#888;
    
        width:40%;
    }
    
    
    .info-table td:last-child{
    
        font-weight:bold;
    
        color:#333;
    }
    
    
    .features{
    
        display:flex;
    
        flex-wrap:wrap;
    
        gap:6px;
    
        margin-bottom:14px;
    }
    
    
    .feature{
    
        background:#edf2ee;
    
        padding:6px 9px;
    
        border-radius:7px;
    
        font-size:10px;
    }
    
    
    .footer{
    
        border-top:
        1px solid #eee;
    
        padding-top:12px;
    
        display:flex;
    
        justify-content:space-between;
    
        align-items:center;
    
        gap:10px;
    }
    
    
    .meta{
    
        display:flex;
    
        flex-direction:column;
    
        gap:4px;
    
        min-width:0;
    }
    
    
    .code,
    .date{
    
        font-size:9px;
    
        color:#999;
    
        white-space:nowrap;
    
        overflow:hidden;
    
        text-overflow:ellipsis;
    
        max-width:160px;
    }
    
    
    .actions{
    
        display:flex;
    
        gap:5px;
    
        flex-wrap:wrap;
    
        justify-content:flex-end;
    }
    
    
    .action{
    
        border:none;
    
        padding:7px 9px;
    
        border-radius:7px;
    
        cursor:pointer;
    
        font-family:inherit;
    
        font-size:10px;
    
        font-weight:bold;
    }
    
    
    .view{
    
        background:#e7f0e9;
    
        color:#b4a800;
    }
    
    
    .edit{
    
        background:#f4edda;
    
        color:#80631b;
    }
    
    
    .delete{
    
        background:#f8e7e7;
    
        color:#9b3434;
    }
    
    
    .price-lines{
    
        display:flex;
    
        flex-direction:column;
    
        gap:5px;
    }
    
    
    .price-line small{
    
        color:#888;
    
        font-size:10px;
    }
    
    
    /* =====================================================
       EMPTY
    ===================================================== */
    
    .empty{
    
        background:white;
    
        padding:55px 25px;
    
        border-radius:18px;
    
        text-align:center;
    
        color:#888;
    
        grid-column:1/-1;
    }
    
    
    .empty-icon{
    
        font-size:40px;
    
        margin-bottom:10px;
    }
    
    
    .empty h2{
    
        margin:
        0 0 7px;
    
        color:#444;
    }
    
    
    .empty p{
    
        margin:0;
    
        font-size:13px;
    }
    
    
    /* =====================================================
       TOAST
    ===================================================== */
    
    .toast{
    
        position:fixed;
    
        left:20px;
    
        bottom:20px;
    
        background:var(--green);
    
        color:white;
    
        padding:12px 16px;
    
        border-radius:11px;
    
        box-shadow:
        0 8px 25px rgba(0,0,0,.2);
    
        opacity:0;
    
        transform:
        translateY(20px);
    
        pointer-events:none;
    
        transition:.25s;
    
        z-index:9999;
    
        font-size:12px;
    }
    
    
    .toast.show{
    
        opacity:1;
    
        transform:
        translateY(0);
    }
    
    
    /* =====================================================
       RESPONSIVE
    ===================================================== */
    
    @media(max-width:1150px){
    
        #propertiesContainer{
    
            grid-template-columns:
            repeat(2,minmax(0,1fr));
    
        }
    
        .search-grid{
    
            grid-template-columns:
            repeat(3,1fr);
    
        }
    
        .more-grid{
    
            grid-template-columns:
            repeat(3,1fr);
    
        }
    
    }
    
    
    @media(max-width:760px){
    
        .main-content{
    
            padding:14px;
    
        }
    
        .header{
    
            flex-direction:column;
    
            align-items:stretch;
    
        }
    
        .search-header{
    
            flex-direction:column;
    
            align-items:stretch;
    
        }
    
        .search-grid{
    
            grid-template-columns:
            1fr 1fr;
    
        }
    
        .more-grid{
    
            grid-template-columns:
            1fr 1fr;
    
        }
    
        #propertiesContainer{
    
            grid-template-columns:1fr;
    
        }
    
        .result-bar{
    
            flex-direction:column;
    
            align-items:flex-start;
    
        }
    
    }
    
    
    @media(max-width:480px){
    
        .search-grid,
        .more-grid{
    
            grid-template-columns:1fr;
    
        }
    
        .property-image{
    
            height:190px;
    
        }
    
    }

    /* =====================================================
       ESCAPE
    ===================================================== */
    
    function escapeHTML(value){
    
        if(
            value === undefined ||
            value === null ||
            value === ""
        ){
    
            return "ثبت نشده";
    
        }
    
    
        return String(value)
    
            .replace(/&/g,"&amp;")
    
            .replace(/</g,"&lt;")
    
            .replace(/>/g,"&gt;")
    
            .replace(/"/g,"&quot;")
    
            .replace(/'/g,"&#039;");
    
    }
    
    
    /* =====================================================
       NORMALIZE PERSIAN TEXT
    ===================================================== */
    
    function normalizeText(value){
    
        return String(
            value ?? ""
        )
    
        .replace(/[يى]/g,"ی")
    
        .replace(/ك/g,"ک")
    
        .replace(/\u200c/g," ")
    
        .trim()
    
        .toLowerCase();
    
    }
    
    
    /* =====================================================
       NUMBER
    ===================================================== */
    
    function numberValue(value){
    
        if(
            value === undefined ||
            value === null ||
            value === ""
        ){
    
            return 0;
    
        }
    
    
        const persian =
            "۰۱۲۳۴۵۶۷۸۹";
    
    
        const arabic =
            "٠١٢٣٤٥٦٧٨٩";
    
    
        let text =
            String(value);
    
    
        for(
            let i=0;
            i<10;
            i++
        ){
    
            text =
                text.replaceAll(
                    persian[i],
                    String(i)
                );
    
    
            text =
                text.replaceAll(
                    arabic[i],
                    String(i)
                );
    
        }
    
    
        text =
            text
            .replace(/,/g,"")
            .replace(/[^\d.-]/g,"");
    
    
        return Number(text) || 0;
    
    }

    /* =====================================================

    ===================================================== */
    
    function money(value){
    
        const number =
            numberValue(value);
    
    
        if(!number){
    
            return "ثبت نشده";
    
        }
    
    
        return (
    
            number.toLocaleString(
                "fa-IR"
            )
    
            +
    
            " تومان"
    
        );
    
    }
    
    
    /* =====================================================
       PRICE FOR FILTER
    ===================================================== */
    
    function getComparablePrice(p){
    
        const type =
            normalizeText(
                getTransaction(p)
            );
    
    
        if(
            type.includes("رهن") &&
            type.includes("اجاره")
        ){
    
            return numberValue(
                getDeposit(p)
            );
    
        }
    
    
        if(
            type.includes("رهن")
        ){
    
            return numberValue(
                getDeposit(p)
            );
    
        }
    
    
        if(
            type.includes("اجاره")
        ){
    
            return numberValue(
                getRent(p)
            );
    
        }
    
    
        return numberValue(
            getPrice(p)
        );
    
    }

    /* =====================================================
       ROOM FILTER
    ===================================================== */
    
    function matchesRooms(
        property,
        selected
    ){
    
        if(!selected){
    
            return true;
    
        }
    
    
        const rooms =
            numberValue(
                getRooms(property)
            );
    
    
        const wanted =
            Number(selected);
    
    
        if(wanted === 5){
    
            return rooms >= 5;
    
        }
    
    
        return rooms === wanted;
    
    }
    
    
    /* =====================================================
       FLOOR FILTER
    ===================================================== */
    
    function matchesFloor(
        property,
        selected
    ){
    
        if(!selected){
    
            return true;
    
        }
    
    
        const floor =
            normalizeText(
                getFloor(property)
            );
    
    
        if(
            selected === "همکف"
        ){
    
            return (
    
                floor.includes("همکف")
    
                ||
    
                numberValue(floor) === 0
    
            );
    
        }
    
    
        if(
            selected === "10"
        ){
    
            return (
                numberValue(floor) >= 10
            );
    
        }
    
    
        return (
    
            floor ===
            normalizeText(selected)
    
            ||
    
            numberValue(floor) ===
            Number(selected)
    
        );
    
    }
    
    
    /* =====================================================
       FEATURE FILTER
    ===================================================== */
    
    function matchesFeatures(
        property,
        selected
    ){
    
        if(
            !selected.length
        ){
    
            return true;
    
        }
    
    
        const propertyFeatures =
            getFeatures(property)
    
            .map(
                normalizeText
            );
    
    
        const aliases = {
    
            elevator:[
                "elevator",
                "آسانسور"
            ],
    
            parking:[
                "parking",
                "پارکینگ"
            ],
    
            storage:[
                "storage",
                "انباری"
            ],
    
            balcony:[
                "balcony",
                "بالکن"
            ],
    
            terrace:[
                "terrace",
                "تراس"
            ],
    
            pool:[
                "pool",
                "استخر"
            ],
    
            sauna:[
                "sauna",
                "سونا"
            ],
    
            jacuzzi:[
                "jacuzzi",
                "جکوزی"
            ],
    
            gym:[
                "gym",
                "سالن ورزشی"
            ],
    
            camera:[
                "camera",
                "دوربین",
                "دوربین مداربسته"
            ],
    
            guard:[
                "guard",
                "نگهبانی"
            ]
    
        };
    
    
        return selected.every(
            function(feature){
    
                const values =
                    aliases[
                        feature
                    ] ||
    
                    [feature];
    
    
                return values.some(
                    value =>
                        propertyFeatures.includes(
                            normalizeText(value)
                        )
                );
    
            }
        );
    
    }
    
    
    /* =====================================================
       ADVANCED FILTER
    ===================================================== */
    
    function getFilteredProperties(){
    
        const search =
            normalizeText(
                $("searchInput").value
            );
    
    
        const propertyType =
            normalizeText(
                $("propertyTypeFilter").value
            );
    
    
        const transaction =
            normalizeText(
                $("transactionFilter").value
            );
    
    
        const region =
            normalizeText(
                $("regionFilter").value
            );
    
    
        const rooms =
            $("roomsFilter").value;
    
    
        const minArea =
            numberValue(
                $("minArea").value
            );
    
    
        const maxArea =
            numberValue(
                $("maxArea").value
            );
    
    
        const minPrice =
            numberValue(
                $("minPrice").value
            );
    
    
        const maxPrice =
            numberValue(
                $("maxPrice").value
            );
    
    
        const floor =
            $("floorFilter").value;
    
    
        const direction =
            normalizeText(
                $("directionFilter").value
            );
    
    
        const documentType =
            normalizeText(
                $("documentFilter").value
            );
    
    
        const status =
            normalizeText(
                $("statusFilter").value
            );
    
    
        const consultant =
            normalizeText(
                $("consultantFilter").value
            );
    
    
        const selectedFeatures =
            getSelectedFeatures();
    
    
        const sort =
            $("sortFilter").value;
    
    
        let list =
            allProperties.filter(
                function(property){
    
                    const rawText =
                        normalizeText(
                            JSON.stringify(
                                property
                            )
                        );
    
    
                    const type =
                        normalizeText(
                            getPropertyType(
                                property
                            )
                        );
    
    
                    const deal =
                        normalizeText(
                            getTransaction(
                                property
                            )
                        );
    
    
                    const propertyRegion =
                        normalizeText(
                            getRegion(
                                property
                            )
                        );
    
    
                    const area =
                        numberValue(
                            getArea(
                                property
                            )
                        );
    
    
                    const propertyDirection =
                        normalizeText(
                            getDirection(
                                property
                            )
                        );
    
    
                    const propertyDocument =
                        normalizeText(
                            property.documentType
                        );
    
    
                    const propertyStatus =
                        normalizeText(
                            property.buildingStatus
                        );
    
    
                    const propertyConsultant =
                        normalizeText(
                            property.createdBy
                        );
    
    
                    const price =
                        getComparablePrice(
                            property
                        );
    
    
                    return (
    
                        (!search ||
                        rawText.includes(
                            search
                        ))
    
                        &&
    
                        (!propertyType ||
                        type.includes(
                            propertyType
                        ))
    
                        &&
    
                        (!transaction ||
                        deal === transaction ||
                        deal.includes(
                            transaction
                        ))
    
                        &&
    
                        (!region ||
                        propertyRegion.includes(
                            region
                        ))
    
                        &&
    
                        matchesRooms(
                            property,
                            rooms
                        )
    
                        &&
    
                        (!minArea ||
                        area >= minArea)
    
                        &&
    
                        (!maxArea ||
                        area <= maxArea)
    
                        &&
    
                        (!minPrice ||
                        price >= minPrice)
    
                        &&
    
                        (!maxPrice ||
                        price <= maxPrice)
    
                        &&
    
                        matchesFloor(
                            property,
                            floor
                        )
    
                        &&
    
                        (!direction ||
                        propertyDirection.includes(
                            direction
                        ))
    
                        &&
    
                        (!documentType ||
                        propertyDocument.includes(
                            documentType
                        ))
    
                        &&
    
                        (!status ||
                        propertyStatus.includes(
                            status
                        ))
    
                        &&
    
                        (!consultant ||
                        propertyConsultant.includes(
                            consultant
                        ))
    
                        &&
    
                        matchesFeatures(
                            property,
                            selectedFeatures
                        )
    
                    );
    
                }
            );
    
    
        /* =================================================
           SORT
        ================================================== */
    
        list.sort(
            function(a,b){
    
                if(
                    sort === "newest"
                ){
    
                    return (
    
                        new Date(
                            b.createdAt || 0
                        )
    
                        -
    
                        new Date(
                            a.createdAt || 0
                        )
    
                    );
    
                }
    
    
                if(
                    sort === "oldest"
                ){
    
                    return (
    
                        new Date(
                            a.createdAt || 0
                        )
    
                        -
    
                        new Date(
                            b.createdAt || 0
                        )
    
                    );
    
                }
    
    
                if(
                    sort === "areaHigh"
                ){
    
                    return (
    
                        numberValue(
                            getArea(b)
                        )
    
                        -
    
                        numberValue(
                            getArea(a)
                        )
    
                    );
    
                }
    
    
                if(
                    sort === "areaLow"
                ){
    
                    return (
    
                        numberValue(
                            getArea(a)
                        )
    
                        -
    
                        numberValue(
                            getArea(b)
                        )
    
                    );
    
                }
    
    
                if(
                    sort === "priceHigh"
                ){
    
                    return (
    
                        getComparablePrice(b)
    
                        -
    
                        getComparablePrice(a)
    
                    );
    
                }
    
    
                if(
                    sort === "priceLow"
                ){
    
                    return (
    
                        getComparablePrice(a)
    
                        -
    
                        getComparablePrice(b)
    
                    );
    
                }
    
    
                return 0;
    
            }
        );
    
    
        return list;
    
    }

    /* =====================================================
       VIEW PROPERTY
    ===================================================== */
    
    function viewProperty(id){
    
        const property =
            allProperties.find(
                function(p){
    
                    return String(
                        getPropertyId(p)
                    )
                    ===
                    String(id);
    
                }
            );
    
    
        if(!property){
    
            alert(
                "ملک موردنظر پیدا نشد."
            );
    
            return;
    
        }
    
    
        localStorage.setItem(
    
            "selectedProperty",
    
            JSON.stringify(
                property
            )
    
        );
    
    
        window.location.href =
            "property-details.html";
    
    }
    
    
    /* =====================================================
       EDIT PROPERTY
    ===================================================== */
    
    function editProperty(id){
    
        const property = allProperties.find(function(p){
    return String(getPropertyId(p)) === String(id) ||
           String(p.code) === String(id) ||
           String(p.propertyCode) === String(id);
});
    
    
        if(!property){
    
            alert(
                "ملک موردنظر پیدا نشد."
            );
    
            return;
    
        }
    
    
        localStorage.setItem(
    
            "editProperty",
    
            JSON.stringify(
                property
            )
    
        );
    
    
        window.location.href =
            "add-property.html";
    
    }
    
    
/*************
 حذف ملک از سرور
*************/

async function deleteProperty(id){

if(!confirm("آیا از حذف این ملک مطمئن هستید؟")){
    return;
}

try{

    const response = await fetch("/api/properties/" + encodeURIComponent(id),{
        method:"DELETE"
    });

    const result = await response.json();

    if(!result.success){
        alert(result.message || "خطا در حذف");
        return;
    }

    // حذف از localStorage
    allProperties = allProperties.filter(function(property){

return String(getPropertyId(property)) !== String(id) &&
       String(property.code) !== String(id) &&
       String(property.propertyCode) !== String(id);

});

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(allProperties)
    );

    render();
    loadProperties();
    alert("ملک با موفقیت حذف شد.");

}catch(error){

    console.error(error);
    alert("خطا در حذف ملک.");

}

}
    /* =====================================================
       RESET FILTERS
    ===================================================== */
    
    function resetFilters(){
    
        document
            .querySelectorAll(
                ".advanced-search input"
            )
            .forEach(
                function(input){
    
                    if(
                        input.type ===
                        "checkbox"
                    ){
    
                        input.checked =
                            false;
    
                    }else{
    
                        input.value =
                            "";
    
                    }
    
                }
            );
    
    
        document
            .querySelectorAll(
                ".advanced-search select"
            )
            .forEach(
                function(select){
    
                    select.value =
                        "";
    
                }
            );
    
    
        $("sortFilter").value =
            "newest";
    
    
        loadProperties();
    
    
        showToast(
            "همه فیلترها پاک شدند."
        );
    
    }
    
    
    /* =====================================================
       TOAST
    ===================================================== */
    
    function showToast(message){
    
        const toast =
            $("toast");
    
    
        toast.textContent =
            message;
    
    
        toast.classList.add(
            "show"
        );
    
    
        clearTimeout(
            window.toastTimer
        );
    
    
        window.toastTimer =
            setTimeout(
                function(){
    
                    toast.classList.remove(
                        "show"
                    );
    
                },
    
                2200
            );
    
    }
    
    
    /* =====================================================
       LOGOUT
    ===================================================== */
    
    function logout(){
    
        localStorage.removeItem(
            "currentUser"
        );
    
    
        window.location.href =
            "index.html";
    
    }

});
